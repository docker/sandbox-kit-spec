# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=../../schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: Codex host sessions
description: Retain Codex session state across sandbox removal
requires: ["codex"]

capabilities:
  - type: com.docker.sandbox/host-mount@1
    config:
      path: /home/agent/codex-history
      mode: "0700"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # One mount keeps renames between state directories on one filesystem.
        # Config and credentials stay in the agent Kit's managed directory.
        - command: |
            set -eu
            state="/home/agent/.codex"
            history="/home/agent/codex-history"
            mkdir -p "$state"
            for name in sessions archived_sessions; do
              link="$state/$name"
              target="$history/$name"
              mkdir -p "$target"
              if [ -L "$link" ]; then
                if [ "$(readlink "$link")" != "$target" ]; then
                  printf 'Refusing to replace unexpected symlink: %s\n' "$link" >&2
                  exit 1
                fi
                continue
              fi
              # rmdir preserves existing sessions. A mount point means the
              # agent kit still declares a private volume here — this mixin
              # needs one that does not.
              if [ -e "$link" ]; then
                if awk -v p="$link" '$5 == p { found=1 } END { exit !found }' /proc/self/mountinfo 2>/dev/null; then
                  printf '%s is a volume mount from the agent kit; compose this mixin with a Codex kit that declares no session volumes.\n' "$link" >&2
                  exit 1
                fi
                if ! rmdir "$link"; then
                  printf 'Cannot replace %s; move existing state to the host directory first.\n' "$link" >&2
                  exit 1
                fi
              fi
              ln -s "$target" "$link"
            done
          user: agent
          description: Link Codex session state to the host-shared directory
