# syntax=docker/sandbox-kit:3
# The Codex agent as a MIXIN, migrated from the built-in v2 codex kit:
# the same credential (API key or ChatGPT OAuth), egress, and hooks, minus
# what only the environment-owning kit carries (the entrypoint — run
# `codex` in the base's shell). CODEX_HOME is image environment so ACP
# launches see it too; exports that may collide with the base ride the
# overlay as /etc/profile.d/codex-env.sh for login shells.
schemaVersion: "3"
displayName: Codex CLI
author: "Docker, Inc."
description: >-
  OpenAI's Codex CLI as a mixin — the native binary in an overlay, with
  the OpenAI credential (API key or ChatGPT OAuth) and the hooks the agent
  needs. Layer it onto a shell base and run `codex`.
sourceUrl: https://github.com/openai/codex

kind: mixin

args:
  version:
    default: "0.166.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Codex CLI release to install
    buildArg: CODEX_VERSION
  # Model selection, resolved at create so one published kit serves every
  # preference: `--kit-arg model=… reasoningEffort=…`, or a kits[] entry's
  # args in sbxenv.yaml. Empty leaves codex's own default in force. Both
  # are also exported into the sandbox environment, so a shell inside can
  # read what the session was created with.
  model:
    default: ""
    pattern: '^[A-Za-z0-9._-]*$'
    description: Codex model to use (config.toml `model`); empty keeps the CLI default
    env: CODEX_MODEL
  reasoningEffort:
    default: ""
    pattern: '^(none|minimal|low|medium|high|xhigh|max|ultra|persistent)?$'
    description: Reasoning effort (config.toml `model_reasoning_effort`); empty keeps the CLI default
    env: CODEX_REASONING_EFFORT

provides: ["codex@${{ kit.args.version }}"]

capabilities:
  # Every domain the credential injects into or routes to, plus the
  # non-credential domains codex itself needs: files.openai.com
  # (attachments/uploads at startup) and the GitHub hosts (codex checks
  # releases for updates and fetches skills/plugins). No npm registry:
  # the package lives outside CODEX_HOME and came from no package
  # manager, so codex offers no upgrade action to run. The base's apt
  # mirrors stay with the base.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com:443
          - openai.com:443
          - auth.openai.com:443
          - chatgpt.com:443
          - files.openai.com:443
          - releases.openai.com:443
          - api.github.com:443
          - github.com:443
          - release-assets.githubusercontent.com:443
          - codeload.github.com:443

  # Declaring both apiKey and oauth means "whichever the host has bound".
  # MIGRATION NOTE: v2's oauth.skipIfEnv is gone — the mode decision
  # belongs to the host's binding, surfaced as SBX_CRED_OPENAI_MODE and
  # read by the install hook below.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access (API key or ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        # Native ChatGPT mode sends model and connector requests here.
        resourceHosts:
          - chatgpt.com
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed
        credentialFile:
          path: ~/.codex/auth.json
          structure:
            auth_mode: chatgpt
            tokens:
              id_token: "{{.IDToken}}"
              access_token: "{{.AccessToken}}"
              refresh_token: "{{.RefreshToken}}"
              account_id: "{{.AccountID}}"
            last_refresh: "{{.LastRefresh}}"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # OAuth auth.json is rendered by the host from masked credentials.
        # API-key mode keeps its existing placeholder cache.
        - command: |
            set -e
            mkdir -p /home/agent/.codex /home/agent/.agents
            MODE="${SBX_CRED_OPENAI_MODE:-none}"
            cat > /home/agent/.codex/config.toml << 'EOF'
            # Codex configuration for Docker sandbox
            # This configuration enables "yolo mode" - no approvals, full access

            approval_policy = "never"
            sandbox_mode = "danger-full-access"
            mcp_oauth_credentials_store = "file"
            # Turn-complete hook for Narwhal (see /usr/local/bin/sbx-codex-hook):
            # raises the desktop notification and forwards the session's model,
            # effort, token usage and git state read from this thread's rollout
            # file. `notify` is top-level and needs no hook trust; Codex spawns
            # it fire-and-forget with the event JSON as the last argument, and
            # the script is a silent no-op when no desktop server is loaded.
            notify = ["/usr/local/bin/sbx-codex-hook", "codex"]
            EOF
            # Model selection from the create-phase args. These are
            # top-level keys, so they must land here, before the
            # features and projects tables below would capture
            # them. The args' patterns admit no quote or backslash, so
            # the expanded value is safe inside the TOML string.
            model='${{ kit.args.model }}'
            effort='${{ kit.args.reasoningEffort }}'
            [ -z "$model" ] || printf 'model = "%s"\n' "$model" >> /home/agent/.codex/config.toml
            [ -z "$effort" ] || printf 'model_reasoning_effort = "%s"\n' "$effort" >> /home/agent/.codex/config.toml
            case "$MODE" in
              oauth)
                cat >> /home/agent/.codex/config.toml << 'EOF'
            forced_login_method = "chatgpt"
            cli_auth_credentials_store = "file"

            [features]
            apps = true
            EOF
                ;;
              apikey)
                echo 'forced_login_method = "api"' >> /home/agent/.codex/config.toml
                ;;
            esac
            # Trust the workspace for launches outside the entrypoint too.
            ws="${WORKSPACE_DIR:-/home/agent/workspace}"
            esc=$(printf '%s' "$ws" | sed 's/\\/\\\\/g; s/"/\\"/g')
            cat >> /home/agent/.codex/config.toml <<EOF

            [projects."$esc"]
            trust_level = "trusted"
            EOF
            case "$MODE" in
              oauth)
                # Clear the old API placeholder without deleting a native cache
                # that the runtime may already have rendered.
                if [ -f /home/agent/.codex/auth.json ] && grep -q '"OPENAI_API_KEY"[[:space:]]*:[[:space:]]*"' /home/agent/.codex/auth.json; then
                  rm -f /home/agent/.codex/auth.json
                fi
                ;;
              apikey)
                cat > /home/agent/.codex/auth.json << 'EOF'
            {
              "OPENAI_API_KEY": "proxy-managed"
            }
            EOF
                ;;
              *)
                rm -f /home/agent/.codex/auth.json
                ;;
            esac
          user: agent
          env: [SBX_CRED_OPENAI_MODE, WORKSPACE_DIR]
          description: Seed Codex config/auth from SBX_CRED_OPENAI_MODE
      startup:
        # Gateway-first MCP registration. config.toml is shared territory
        # (the install seed above and codex itself both write it), so
        # append rather than overwrite; the grep guard makes the script
        # idempotent across gateway restarts. No-op when MCP isn't
        # enabled.
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            cfg="$HOME/.codex/config.toml"
            touch "$cfg"
            grep -q "^\[mcp_servers.mcp-gateway\]" "$cfg" && exit 0
            esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
            url=$(esc "$MCP_GATEWAY_URL")
            auth=$(esc "$MCP_SENTINEL_TOKEN_NAME")
            # Codex's grammar for a streamable HTTP server: the transport
            # is implied by `url` (a `command` would make it stdio; there
            # is no `type` key), and static headers go in `http_headers`.
            # A `[...headers]` sub-table is not read, so the gateway
            # would be reached without its bearer token and codex would
            # warn about both keys at startup.
            cat >> "$cfg" <<EOF

            [mcp_servers.mcp-gateway]
            url = "$url"
            http_headers = { Authorization = "Bearer $auth" }
            EOF
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway in ~/.codex/config.toml

  # Where codex reads shared skills, so the host's store reaches it in
  # the mixin shape too.
  # The runtime also exposes selected agent-skill@1 bundles here, even
  # when host sharing is off or the user has no host skills.
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills

  # Offer both versions during the runtime rollout; select one.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      filename: AGENTS.md
      directory: /home/agent/.codex
      content: |
        Codex CLI is installed at `/usr/local/bin/codex`. Run `codex` for an
        interactive session or `codex exec "<prompt>"` for a one-shot run.

        Authentication is managed on the host with `sbx secret set openai`.
        API-key mode uses an `OPENAI_API_KEY` sentinel; ChatGPT mode uses a
        native identity cache with filtered claims and unusable token
        signatures. The sandbox proxy supplies the real credentials on
        authorized requests. If authentication is missing, sign in on the
        host and recreate the sandbox.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
