  # Accept one context version through runtime policy, or skip both.
  # Accepting both conflicts; optionality does not express alternatives.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        ## pstack skills

        The pstack skill collection is bundled at /usr/share/pstack/skills/.
        Read /usr/share/pstack/README.md for the catalog and dependencies.
        Each skill has a SKILL.md; supporting files, sibling skills, guides,
        and agent templates are available in the same source tree.

        When the user invokes a pstack skill, read its SKILL.md there.
        Start with poteto-help/SKILL.md for help choosing a skill, or
        poteto-mode/SKILL.md when the user asks to use the main workflow.
        If native skill discovery is unavailable, read these absolute paths
        directly. Resolve links from the bundled source tree so references
        to sibling skills, ../../docs, and ../../agents stay together.

        Use the consuming agent's own tools and available models. The kit
        does not install Cursor plugins, register custom subagents, or
        supply external services referenced by individual workflows.
  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
