# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: pstack
description: Agent-neutral engineering skills, playbooks, and principles.
sourceUrl: https://github.com/backnotprop/pstack
licenses: [MIT]
version: "${{ kit.args.version }}"
provides: ["pstack@${{ kit.args.version }}"]

args:
  version:
    default: "0.15.36"
    # The mirror has no release tags; the recipe pins a reviewed snapshot.
    enum: ["0.15.36"]
    description: Plugin version verified against the pinned source snapshot
    buildArg: PSTACK_VERSION

capabilities:
  # Native discovery when supported; context is a fallback for other agents.
  # Wrappers load absolute source paths so copied bundles keep working.
  - type: com.docker.sandbox/agent-skill@1
    optional: true
    config:
      path: /usr/share/pstack-skills/architect
