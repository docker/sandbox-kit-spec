# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Git commit signing
description: >-
  Signs the agent's git commits and tags with the user's SSH key, through
  the SSH agent the runtime exposes. The agent may make git signatures and
  nothing else: no logins, no other namespaces, and no network.

kind: mixin
provides: ["git-signing@1.0.0"]
version: "1.0.0"

capabilities:
  # Git's SSH signing makes namespaced signatures in the namespace `git`
  # and nothing else, so that is the whole grant: the key cannot log in
  # anywhere or sign in another namespace from this sandbox. Signing is
  # enabled below, so creation requires an agent.
  - type: com.docker.sandbox/ssh-agent@1
    description: Sign git commits and tags with the user's SSH key
    config:
      phase: runtime
      unrestricted: false
      sign: [git]

  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # Fill only missing XDG defaults; ~/.gitconfig still takes precedence.
        - command: |
            set -eu
            config="${XDG_CONFIG_HOME:-$HOME/.config}/git/config"
            mkdir -p "$(dirname "$config")"
            set_default() {
              if git config --file "$config" --get "$1" >/dev/null; then
                return
              else
                status=$?
                [ "$status" -eq 1 ] || return "$status"
              fi
              git config --file "$config" "$1" "$2"
            }
            set_default gpg.format ssh
            set_default gpg.ssh.defaultKeyCommand 'ssh-add -L'
            set_default commit.gpgsign true
            set_default tag.gpgsign true
          env: [XDG_CONFIG_HOME]
          description: Merge missing signing defaults without replacing user settings

  # Offer both versions during the runtime rollout; select one.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        # Git commit signing

        Commits and tags you make are signed with the user's SSH key, through the
        agent at `$SSH_AUTH_SOCK`. You do not need to pass `-S`.

        - The agent signs git signatures only. It will not log in to servers or
          sign anything else, so do not try to use it for `ssh` or `ssh-keygen -Y
          sign` with another namespace.
        - If `ssh-add -L` reports no agent or no identities, signing is not
          available: ask the user to reconnect the agent before committing.
        - Signing a commit does not mean the user reviewed it. Say which commits
          you made.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
