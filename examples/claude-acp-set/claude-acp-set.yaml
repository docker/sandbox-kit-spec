# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
displayName: Claude over ACP
author: "Docker, Inc."
description: >-
  A sandbox an ACP client can drive: a shell base, Claude Code, and the
  Agent Client Protocol adapter that fronts it — published as one kit.
  The same three kits compose by hand; this exists so an editor can be
  pointed at one reference instead of three that have to agree.
sourceUrl: https://github.com/docker/sandbox-kit-spec
licenses: [Apache-2.0]

kind: set
version: "1.0.3"

args:
  # The kits below are published references, so the namespace they live
  # under is the one thing this file cannot hardcode. A build-phase arg
  # is its home: the value is expanded into the kits list before the
  # merge resolves anything, and baked into the published descriptor.
  registry:
    default: docker.io/docker
    # A colon so a registry can carry a port: the throwaway
    # localhost:5000 the docs recommend is the common case, and the
    # expanded references are parsed properly by the validator.
    pattern: '^[a-z0-9][a-z0-9._/:-]*$'
    description: Registry namespace the listed kits were pushed to
    buildArg: KIT_REGISTRY

kits:
  # The base. One of them is a workload, so the merged kit is one too,
  # and the set selects the agent's discovery profile below.
  - ref: ${{ kit.args.registry }}/sbx-kit-shell:1.0.0

  # Claude Code itself: the binary at /usr/local/bin/claude, the
  # Anthropic egress and credential, and the session-state volumes. The
  # adapter below contributes none of that because it drives this
  # kit's claude rather than talking to Anthropic itself.
  #
  # The mixin rather than the claude workload kit because the shell kit
  # above is already the workload. The adapter would find either one's
  # claude: its wrapper resolves the binary on PATH, so the workload's
  # $HOME/.local/bin install works as well as this kit's /usr/local/bin.
  - ref: ${{ kit.args.registry }}/sbx-kit-claude-mixin:2.1.310

  # The ACP adapter. Its requires: ["claude"] is answered by the kit
  # above — which is also what orders the two, whatever order they are
  # listed in here.
  - ref: ${{ kit.args.registry }}/sbx-kit-claude-acp:0.96.0

# The set's own declarations merge on top of the three. This one adds
# a note: how to reach the adapter, which is the one thing none of
# the kits can say on its own, because none of them knows it was
# composed with the others.
capabilities:
  # Offer both versions during the runtime rollout; select one.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      filename: CLAUDE.md
      directory: /home/agent/.claude
      content: |
        # Claude over ACP

        This sandbox is a published *set*: one kit whose content was merged from
        a shell base, Claude Code, and the Agent Client Protocol adapter. Run
        `cat /usr/share/sandbox/kit/claude-acp-set/kit.yaml` to see the three, each pinned
        by digest, and `ls /usr/share/sandbox/kit/` to see their own sources
        staged beside each other.

        Two ways to work here, and they are the same agent either way:

        - Interactively, `claude` — the binary at `/usr/local/bin/claude`.
        - Over ACP, `claude-agent-acp` on stdio, which an editor spawns and
          speaks the protocol to. It execs the same binary, so a session driven
          from an editor and one typed at the terminal share the version, the
          credential, and the session-state volumes.

        The adapter opens no sockets of its own. Its egress and its Anthropic
        credential are the ones Claude Code already has, which is why the merged
        network policy names `api.anthropic.com` once rather than twice.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
