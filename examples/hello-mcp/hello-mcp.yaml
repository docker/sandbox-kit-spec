# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Hello MCP
author: "Christian Dupuis <cd@docker.com>"
description: >-
  Smallest possible MCP server Kit: a sandbox whose launch is a stdio
  server with one greet tool, for another sandbox's MCP gateway or an
  MCP client on the host to connect to.

kind: workload
provides: ["hello-mcp@1.0.0"]

args:
  # Resolved when the sandbox is created and handed to the server on
  # its command line through mcp-server@1 arguments below.
  greeting:
    default: hello
    pattern: "^[A-Za-z][A-Za-z ,!]{0,31}$"
    description: Word the greet tool opens with

capabilities:
  # No command: the server is this sandbox's launch, so the entry only
  # says how to reach it. arguments replace the launch's cmd, as
  # docker run <image> <args> would; the endpoint fields stay literal.
  # The server needs no egress, so the Kit declares no network policy
  # and gets none.
  - type: com.docker.sandbox/mcp-server@1
    config:
      name: hello
      transport: stdio
      arguments: ["--greeting=${{ kit.args.greeting }}"]
