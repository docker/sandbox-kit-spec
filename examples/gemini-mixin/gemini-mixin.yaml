# syntax=docker/sandbox-kit:3
# Google's Gemini CLI as a MIXIN: node plus the npm package in an overlay,
# with the same credential, egress, and hooks as the gemini workload,
# minus what only the environment-owning kit carries (the entrypoint —
# run `gemini` in the base's shell — and the base's apt mirrors).
schemaVersion: "3"
displayName: Gemini CLI (mixin)
author: "Docker, Inc."
description: >-
  Google's Gemini CLI as a mixin — node and the CLI in an overlay, with a
  proxy-managed Gemini API key and the hooks the agent needs. Layer it
  onto a shell base and run `gemini`.
sourceUrl: https://github.com/google-gemini/gemini-cli

kind: mixin

args:
  version:
    default: "0.62.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Gemini CLI release to install
    buildArg: GEMINI_VERSION

provides: ["gemini@${{ kit.args.version }}"]

dockerfile: ./gemini-mixin.dockerfile

capabilities:
  # accounts.google.com is gemini's login flow; the googleapis hosts are
  # the credential's inject domains, which the allow list must name.
  # base's apt mirrors stay with the base.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - accounts.google.com:443
          - aiplatform.googleapis.com:443
          - generativelanguage.googleapis.com:443
          - oauth2.googleapis.com:443
          - vertexai.googleapis.com:443

  # proxyManaged: the value gemini sees is a sentinel; the proxy swaps
  # the real key at the Google endpoints.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Google AI API access (Gemini API key)
    config:
      service: google
      phase: runtime
      apiKey:
        name: GEMINI_API_KEY
        proxyManaged: true
        inject:
          - {domain: aiplatform.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: generativelanguage.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: oauth2.googleapis.com, header: x-goog-api-key, format: "%s"}
          - {domain: vertexai.googleapis.com, header: x-goog-api-key, format: "%s"}

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: mkdir -p /home/agent/.gemini && chown 1000:1000 /home/agent/.gemini && (chmod 644 /home/agent/.gemini/settings.json 2>/dev/null || true)
          user: "0"
          description: Ensure ~/.gemini exists with agent ownership
      files:
        # Baseline non-MCP settings the agent depends on; seeded only when
        # absent, because gemini-cli and the MCP hook below both write the
        # same file.
        - path: /home/agent/.gemini/settings.json
          content: '{"tools":{"sandbox":false},"security":{"disableYoloMode":false,"folderTrust":{"enabled":false}},"ui":{"useFullWidth":true}}'
          overwrite: false
          description: Baseline gemini settings for sandbox use
      startup:
        # Gateway-first MCP registration, merged with jq rather than
        # overwritten: settings.json is shared territory, and the deep
        # merge keeps the baseline keys while adding mcpServers. Atomic
        # write-temp + rename so a crash mid-merge leaves the baseline
        # intact. No-op when MCP isn't enabled.
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            frag=/tmp/sandbox-mcp-gateway.json
            jq -n --arg url "$MCP_GATEWAY_URL" --arg auth "Bearer $MCP_SENTINEL_TOKEN_NAME" \
              '{mcpServers: {"mcp-gateway": {httpUrl: $url, headers: {Authorization: $auth}}}}' > "$frag"
            [ -f "$HOME/.gemini/settings.json" ] || echo '{}' > "$HOME/.gemini/settings.json"
            jq -s '.[0] * .[1]' "$HOME/.gemini/settings.json" "$frag" \
              > "$HOME/.gemini/settings.json.tmp"
            mv "$HOME/.gemini/settings.json.tmp" "$HOME/.gemini/settings.json"
            rm -f "$frag"
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway in ~/.gemini/settings.json

  # gemini reads its profile as GEMINI.md, not AGENTS.md.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: GEMINI.md
      directory: /home/agent/.gemini
      contentFile: ./gemini-context.md
