# syntax=docker/sandbox-kit:3
# Cognition's Devin CLI as a WORKLOAD, migrated from the built-in v2 devin
# kit: the template image as content, v2's entrypoint in the image config,
# the passthrough Devin credential with its rendered credentials.toml, and
# the config and MCP seeds.
schemaVersion: "3"
displayName: Devin
author: "Docker, Inc."
description: >-
  Cognition's Devin CLI as a complete workload: the sandbox-templates
  base, the passthrough Devin credential captured at in-sandbox login,
  scoped egress, and the config seeds the agent needs.
sourceUrl: https://devin.ai
version: "0.1.0"

kind: workload

provides: ["devin"]

dockerfile: ./devin.dockerfile

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather
  # than running the image's entrypoint as PID 1, and honors the identity
  # the image config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # The Devin/Windsurf hosts the credential routes to, the CLI's own
  # login and asset hosts, and the template's apt mirrors (a workload
  # owns its base).
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.devin.ai:443
          - app.devin.ai:443
          - windsurf.com:443
          - server.codeium.com:443
          - unleash.codeium.com:443
          - cli.devin.ai:443
          - static.devin.ai:443
          - archive.ubuntu.com:80
          - security.ubuntu.com:80
          - ports.ubuntu.com:80
          - download.docker.com:443

  # The Devin credential is captured during in-sandbox login and flows
  # PASSTHROUGH: the real token reaches the named hosts, and the
  # credential file below renders it for the CLI. The key is inject-only,
  # matching v2's empty name — no env var carries it, not even a
  # sentinel.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Devin account credential captured during in-sandbox login
    config:
      service: devin
      phase: runtime
      # Inject-only: the credential is captured at in-sandbox login and
      # exists as outbound rewrites; no env var carries it, not even a
      # sentinel.
      apiKey:
        inject:
          - {domain: server.codeium.com, header: Authorization, format: "Bearer %s"}
          - {domain: api.devin.ai, header: Authorization, format: "Bearer %s"}
      oauth:
        tokenEndpoint: {host: api.devin.ai, path: /auth/cli/token}
        resourceHosts:
          - server.codeium.com
          - api.devin.ai
        # Devin's token response carries one field serving both roles.
        responseFields:
          accessToken: token
          refreshToken: token
        passthrough: true
        # Devin reads a TOML credentials file; format: toml keeps the
        # declaration declarative (nested maps would become tables) while
        # producing the file the CLI expects.
        credentialFile:
          path: "~/.local/share/devin/credentials.toml"
          format: toml
          structure:
            api_server_url: "https://server.codeium.com"
            devin_webapp_host: "app.devin.ai"
            devin_api_url: "https://api.devin.ai"
            windsurf_api_key: "{{.PrimaryApiKey}}"

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        # Seeded only when absent: the agent owns its config after.
        - path: /home/agent/.config/devin/config.json
          content: '{"auto_update": false}'
          overwrite: false
          description: Disable Devin background updates
      startup:
        # Gateway-first MCP registration, merged with jq rather than
        # overwritten: startup runs on every boot, and mcp_config.json is
        # the agent's whole MCP surface, so truncating it would delete
        # user-added servers. Deep merge updates only the mcp-gateway
        # entry; write-temp + rename keeps a crash from leaving a
        # half-written file. No-op when MCP isn't enabled.
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            mkdir -p "$HOME/.config/devin"
            cfg="$HOME/.config/devin/mcp_config.json"
            frag=/tmp/sandbox-mcp-gateway.json
            jq -n --arg url "$MCP_GATEWAY_URL" --arg auth "Bearer $MCP_SENTINEL_TOKEN_NAME" \
              '{mcpServers: {"mcp-gateway": {url: $url, transport: "http", headers: {Authorization: $auth}}}}' > "$frag"
            [ -f "$cfg" ] || echo '{}' > "$cfg"
            jq -s '.[0] * .[1]' "$cfg" "$frag" > "$cfg.tmp"
            mv "$cfg.tmp" "$cfg"
            rm -f "$frag"
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway by merging into mcp_config.json

  # Where devin reads shared skills, so the host's store reaches it.
  # The runtime also exposes selected agent-skill@1 bundles here, even
  # when host sharing is off or the user has no host skills.
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills

  # Offer both versions during the runtime rollout; select one.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      filename: AGENTS.md
      content: |
        # Devin

        This sandbox runs Cognition's Devin CLI. The Devin account credential is
        captured during in-sandbox login and flows passthrough; the config seed
        disables background updates.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
