# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Shell
author: "Docker, Inc."
description: >-
  A plain shell sandbox on the shell-docker template — bash, git, apt, Docker,
  plus common CLI tooling (curl, gh, jq, make, gcc, Python, Node). The base
  workload agent mixins layer onto; it ships no agent and declares no
  credentials.
sourceUrl: https://github.com/docker/sandbox-kit-spec

kind: workload
version: "1.0.1"

# No explicit provides: APT-managed tools, including the trust-fix
# upgrades in the recipe, are inferred from dpkg as deb/<package>@<version>
# at publish (§9.6). Do not assign the kit's version to tool names.

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather
  # than running the image's entrypoint as PID 1, and honors the identity
  # the image config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # Apt sources on shell-docker (Debian trixie / DHI):
  #   deb.debian.org/debian, deb.debian.org/debian-security, dhi.io/deb/...
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - deb.debian.org
          - dhi.io

  # This legacy profile is the fallback. An agent mixin can select its
  # discovery destination; every composed Kit contributes guidance there.
  - type: com.docker.sandbox/agent-context@2
    config:
      filename: AGENTS.md
      content: |
        This is a plain shell sandbox on the shell-docker template: bash,
        git, apt, Docker (compose/buildx), curl, gh, jq, make, gcc,
        Python 3, and Node/npm. Install more with apt; composed kits list
        their own capabilities below.
