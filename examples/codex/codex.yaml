# syntax=docker/sandbox-kit:3
# The Codex agent as a WORKLOAD, migrated from the built-in v2 codex kit:
# the template image as content with codex re-pinned to the published
# version, v2's entrypoint and environment in the image config, and the
# same credential, egress, and hooks as the codex-mixin — a workload needs
# them just as much, since nothing outside the kit seeds codex config in
# kit-world.
schemaVersion: "3"
displayName: Codex
author: "Docker, Inc."
description: >-
  OpenAI's Codex CLI as a complete workload: the sandbox-templates base
  with codex pinned to the published release, the OpenAI credential (API
  key or ChatGPT OAuth), scoped egress, and the config/auth seeds the
  agent needs.
sourceUrl: https://github.com/openai/codex

kind: workload

args:
  version:
    default: "0.160.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Codex CLI release to install
    buildArg: CODEX_VERSION
  # Model selection, resolved at create so one published kit serves every
  # preference: `--kit-arg model=… reasoningEffort=…`, or a kits[] entry's
  # args in sbxenv.yaml. Empty leaves codex's own default in force. Both
  # are also exported into the sandbox environment, so a shell inside can
  # read what the session was created with.
  model:
    default: ""
    pattern: '^[A-Za-z0-9._-]*$'
    description: Codex model to use (config.toml `model`); empty keeps the CLI default
    env: CODEX_MODEL
  reasoningEffort:
    default: ""
    pattern: '^(none|minimal|low|medium|high|xhigh|max|ultra|persistent)?$'
    description: Reasoning effort (config.toml `model_reasoning_effort`); empty keeps the CLI default
    env: CODEX_REASONING_EFFORT

provides: ["codex@${{ kit.args.version }}"]

dockerfile: ./codex.dockerfile

capabilities:
  # This workload is an agent sandbox: the host launches the agent rather
  # than running the image's entrypoint as PID 1, and honors the identity
  # the image config declares instead of assuming one.
  - type: com.docker.sandbox/sbx@1

  # Every domain the credential injects into or routes to, plus the
  # non-credential domains codex itself needs and the template's apt
  # mirrors (a workload owns its base, so the mirrors ride here).
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com:443
          - openai.com:443
          - auth.openai.com:443
          - chatgpt.com:443
          - files.openai.com:443
          - registry.npmjs.org:443
          - releases.openai.com:443
          - api.github.com:443
          - github.com:443
          - release-assets.githubusercontent.com:443
          - codeload.github.com:443
          - archive.ubuntu.com:80
          - security.ubuntu.com:80
          - ports.ubuntu.com:80
          - download.docker.com:443

  # Declaring both apiKey and oauth means "whichever the host has bound".
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI API access (API key or ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        # OAuth-mode model calls route through chatgpt.com/backend-api/codex
        # with the sentinel bearer — resourceHosts is what tells the proxy
        # to substitute the real token there, not just at the token
        # endpoint.
        resourceHosts:
          - chatgpt.com
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Seed ~/.codex/config.toml + ~/.codex/auth.json, branching on the
        # auth mode surfaced via SBX_CRED_OPENAI_MODE — identical to the
        # codex-mixin's seed, because a workload gets no seeding from
        # anywhere else. Deterministic from the mode, so idempotent.
        - command: |
            set -e
            mkdir -p /home/agent/.codex /home/agent/.agents
            MODE="${SBX_CRED_OPENAI_MODE:-none}"
            cat > /home/agent/.codex/config.toml << 'EOF'
            approval_policy = "never"
            sandbox_mode = "danger-full-access"
            mcp_oauth_credentials_store = "file"
            # Turn-complete hook for sbx Desktop (see /usr/local/bin/sbx-codex-hook):
            # raises the desktop notification and forwards the session's model,
            # effort, token usage and git state read from this thread's rollout
            # file. `notify` is top-level and needs no hook trust; Codex spawns
            # it fire-and-forget with the event JSON as the last argument, and
            # the script is a silent no-op when no desktop server is loaded.
            notify = ["/usr/local/bin/sbx-codex-hook", "codex"]
            EOF
            # Model selection from the create-phase args. These are
            # top-level keys, so they must land here, before the
            # model_providers and projects tables below would capture
            # them. The args' patterns admit no quote or backslash, so
            # the expanded value is safe inside the TOML string.
            model='${{ kit.args.model }}'
            effort='${{ kit.args.reasoningEffort }}'
            [ -z "$model" ] || printf 'model = "%s"\n' "$model" >> /home/agent/.codex/config.toml
            [ -z "$effort" ] || printf 'model_reasoning_effort = "%s"\n' "$effort" >> /home/agent/.codex/config.toml
            case "$MODE" in
              oauth|apikey)
                cat >> /home/agent/.codex/config.toml << 'EOF'
            forced_login_method = "api"
            EOF
                ;;
            esac
            if [ "$MODE" = oauth ]; then
              cat >> /home/agent/.codex/config.toml << 'EOF'

            model_provider = "sandboxd"

            [model_providers.sandboxd]
            name = "Sandbox Proxy"
            base_url = "https://chatgpt.com/backend-api/codex"
            experimental_bearer_token = "oai-oat01-proxy-managed"
            requires_openai_auth = false
            EOF
            fi
            # Trust the workspace for launches outside the entrypoint too.
            # Keep this after all top-level config keys: the projects
            # table would otherwise capture settings like model_provider.
            ws="${WORKSPACE_DIR:-/home/agent/workspace}"
            esc=$(printf '%s' "$ws" | sed 's/\\/\\\\/g; s/"/\\"/g')
            cat >> /home/agent/.codex/config.toml <<EOF

            [projects."$esc"]
            trust_level = "trusted"
            EOF
            case "$MODE" in
              oauth|apikey)
                cat > /home/agent/.codex/auth.json << 'EOF'
            {
              "OPENAI_API_KEY": "proxy-managed"
            }
            EOF
                ;;
              *)
                rm -f /home/agent/.codex/auth.json
                ;;
            esac
          user: agent
          env: [SBX_CRED_OPENAI_MODE, WORKSPACE_DIR]
          description: Seed Codex config/auth from SBX_CRED_OPENAI_MODE
      startup:
        # Gateway-first MCP registration; append-with-guard keeps it
        # idempotent across gateway restarts. No-op when MCP is off.
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            cfg="$HOME/.codex/config.toml"
            touch "$cfg"
            grep -q "^\[mcp_servers.mcp-gateway\]" "$cfg" && exit 0
            esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
            url=$(esc "$MCP_GATEWAY_URL")
            auth=$(esc "$MCP_SENTINEL_TOKEN_NAME")
            # Codex's grammar for a streamable HTTP server: the transport
            # is implied by `url` (a `command` would make it stdio; there
            # is no `type` key), and static headers go in `http_headers`.
            # A `[...headers]` sub-table is not read, so the gateway
            # would be reached without its bearer token and codex would
            # warn about both keys at startup.
            cat >> "$cfg" <<EOF

            [mcp_servers.mcp-gateway]
            url = "$url"
            http_headers = { Authorization = "Bearer $auth" }
            EOF
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Register the sandbox MCP gateway in ~/.codex/config.toml

  # Headless verbs, so a host can drive sessions without the TTY. Verb
  # entries are argv tails appended to the entrypoint's launch command.
  - type: com.docker.sandbox/agent-sessions@1
    config:
      prompt: ["exec", "{{.Prompt}}"]
      resume: ["resume", "{{.SessionID}}"]
      continue: ["resume", "--last"]
      list:
        - /bin/sh
        - -c
        - |
          set -eu
          tmp=$(mktemp -d)
          mkfifo "$tmp/in" "$tmp/out"
          codex app-server <"$tmp/in" >"$tmp/out" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :; rm -rf "$tmp"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          exec 3>"$tmp/in" 4<"$tmp/out"

          id=0
          rpc() {
            id=$((id + 1))
            jq -nc --argjson id "$id" --arg method "$1" --argjson params "$2" \
              '{id: $id, method: $method, params: $params}' >&3
            while IFS= read -r response <&4; do
              if printf '%s\n' "$response" |
                jq -e --argjson id "$id" '.id == $id' >/dev/null; then
                printf '%s\n' "$response" | jq -e \
                  'if has("error") then error(.error | tostring) else has("result") end' >/dev/null
                return
              fi
            done
            echo 'Codex exited before responding' >&2
            exit 1
          }

          rpc initialize '{"clientInfo":{"name":"session_list","version":"1.0"}}'
          printf '%s\n' '{"method":"initialized","params":{}}' >&3
          : >"$tmp/sessions"

          # Match Codex's user-facing resume picker, including exec and
          # app-server sessions. Sub-agent and unknown threads stay out.
          for archived in false true; do
            cursor=null
            while :; do
              params=$(jq -nc --argjson cursor "$cursor" --argjson archived "$archived" '
                {
                  limit: 100, cursor: $cursor, archived: $archived,
                  sourceKinds: ["cli", "vscode", "exec", "appServer"]
                }')
              rpc thread/list "$params"
              printf '%s\n' "$response" | jq -c --argjson archived "$archived" \
                '.result.data[] + {archived: $archived}' >>"$tmp/sessions"
              cursor=$(printf '%s\n' "$response" | jq -c '.result.nextCursor')
              [ "$cursor" != null ] || break
            done
          done

          # Each page is ordered, but active and archived pages must be
          # sorted together before emitting the v1 ID-only result.
          jq -r -s '
            unique_by(.id)
            | sort_by(.updatedAt // 0)
            | reverse
            | .[].id' "$tmp/sessions"

  # Interactive verbs, for a host that puts a person at the terminal. Tails
  # append to the entrypoint (whose global flags precede the subcommand) and
  # run with a terminal attached. The bare launch is the TUI, so newSession
  # is omitted and takes the lifecycle@1 interactive launch. `resume` is the
  # interactive subcommand here; the headless one above is `exec`. codex
  # prints no session list a command can read, so there is no list.
  - type: com.docker.sandbox/agent-interactive-sessions@1
    optional: true
    config:
      # `--` ends the options: a prompt starting with `-` stays a prompt.
      prompt: ["--", "{{.Prompt}}"]
      continue: ["resume", "--last"]
      resume: ["resume", "{{.SessionID}}"]
      sessionPicker: ["resume"]

  # Where codex reads shared skills, so the host's store reaches it.
  # The runtime also exposes selected agent-skill@1 bundles here, even
  # when host sharing is off or the user has no host skills.
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills

  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      directory: /home/agent/.codex
      contentFile: ./codex-context.md
