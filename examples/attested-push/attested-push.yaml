# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Attested push
description: >-
  Gives the sandbox a workload identity of its own and bounds where it may
  push: Conventional Commits branches (feat/*, fix/*, chore/* and the other
  types) of the remotes one pattern admits, never main, release branches
  or tags, and never deleting a ref. Every pushed commit must carry the
  sandbox's identity trailers so the ledger can attribute it.

kind: mixin
provides: ["attested-push"]
version: "1.0.0"

args:
  # A host/owner/repo pattern with at most one `*`, which also matches
  # `/`: `github.com/*` is every repository on GitHub, `github.com/docker/*`
  # one organization, `github.com/docker/sandboxes` one repository.
  remote:
    default: github.com/*
    pattern: '^[a-z0-9.-]+(/[A-Za-z0-9._*-]+)+$'
    description: Remote pattern the sandbox may push to, as host/owner/repo with at most one `*`

capabilities:
  # Presence is the request. The host mints the identity before launch and
  # names it on each commit as `Sandbox-Id` and `Co-authored-by` trailers;
  # the person stays author and committer. A host with identity disabled
  # refuses the create rather than running this kit unattested.
  # `ledger: required` also refuses when the Identity Service is
  # unreachable, so the record of what this sandbox pushed is never
  # silently missing.
  - type: com.docker.sandbox/workload-identity@1
    description: Attribute commits and pushes to this sandbox
    config:
      trailers: full
      ledger: required

  # Constraints, not grants: reaching GitHub is the network policy's
  # business and authenticating is credential@1's or ssh-agent@1's. Each
  # field narrows what a composed workload may already do, so another
  # kit cannot widen these bounds, only tighten them further.
  - type: com.docker.sandbox/git-push@1
    description: Push only to Conventional Commits branches of ${{ kit.args.remote }}
    config:
      remotes: ["${{ kit.args.remote }}"]
      refs:
        # One entry per Conventional Commits type: a pattern holds one `*`,
        # so the types cannot be folded into a single alternation. Exclude
        # wins over include, so the default branches, release branches and
        # tags stay closed even if a type were ever added that matched them.
        include:
          - refs/heads/feat/*
          - refs/heads/fix/*
          - refs/heads/docs/*
          - refs/heads/style/*
          - refs/heads/refactor/*
          - refs/heads/perf/*
          - refs/heads/test/*
          - refs/heads/build/*
          - refs/heads/ci/*
          - refs/heads/chore/*
          - refs/heads/revert/*
        exclude:
          - refs/heads/main
          - refs/heads/master
          - refs/heads/develop
          - refs/heads/release/*
          - refs/heads/hotfix/*
          - refs/tags/*
      delete: deny
      commits:
        # `require` needs an ssh-agent@1 signing grant in the composition
        # (see examples/git-signing); on its own this kit only records
        # whether a signature was present.
        signed: prefer
        trailer: require

  # Offer both versions during the runtime rollout; select one.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        # Attested push

        This sandbox has an identity of its own. Commits you make keep the
        user as author and committer and carry `Sandbox-Id` and
        `Co-authored-by` trailers naming the sandbox; the host records every
        push in its ledger.

        - You may push only to branches named after a Conventional Commits
          type (`feat/*`, `fix/*`, `docs/*`, `style/*`, `refactor/*`,
          `perf/*`, `test/*`, `build/*`, `ci/*`, `chore/*`, `revert/*`) in
          `${{ kit.args.remote }}`. Pushes to `main`,
          `master`, `develop`, release or hotfix branches, or tags are
          refused, as is deleting any ref. Do not try to work around a
          refusal; tell the user what was refused and why.
        - Create commits with `git commit` so the sandbox hook adds the
          trailers. Plumbing such as `git commit-tree`, or a `core.hooksPath`
          override, skips the hook and the push is refused when a new commit
          lacks this sandbox's `Sandbox-Id` trailer. Do not rewrite history
          made outside this sandbox for the same reason.
        - Leave author and committer as configured. Do not set
          `GIT_AUTHOR_*`, `GIT_COMMITTER_*` or `--author`: the user's
          signature only shows as verified when they are the committer, and
          the ledger attributes the push to them regardless of the header.
        - Pushing is not review. Open a pull request from the branch and say
          which commits you made.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
