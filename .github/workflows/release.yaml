name: release

on:
  push:
    tags:
      # Schema-3 frontend + Go module major (path …/v3). See RELEASES.md.
      - "v3.*"

# Publishes kit-tck via GoReleaser and the BuildKit frontend image to Hub.
# Docker Hub OIDC authenticates public-image pulls and frontend publication.
permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  release:
    name: release kit-tck and frontend
    runs-on: ubuntu-latest
    outputs:
      previous-tag: ${{ steps.release-range.outputs.previous-tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate
        run: task validate

      # Match ci.yaml: pin the golangci-lint binary via the action, then
      # markdown through Task (docker image + .markdownlint-cli2.yaml).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: cmd/frontend
          args: --config=../../.golangci.yml

      # The markdownlint image comes from Docker Hub, whose anonymous pull
      # limit is shared by every job on a runner's IP.
      - name: Log in to Docker Hub for public-image pulls
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Markdownlint
        run: task lint:md

      - name: Unit tests
        run: task test:unit test:consumer

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Refresh credentials before QEMU setup and frontend publication.
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # Default is 300s; multi-arch QEMU builds often exceed that before push.
          # login-action@v4.6.0 caps this at 3600 (1h).
          DOCKERHUB_OIDC_EXPIREIN: "3600"
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push frontend image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          promote=
          # Automatically promote :3 only when this stable tag is the highest v3.X.Y on
          # the remote — reruns of older stables must not regress it.
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            highest=$(git tag -l 'v3.*.*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)
            if [ "v${version}" = "$highest" ]; then
              promote=1
            fi
          fi
          FRONTEND_PUSH_OK=1 FRONTEND_PROMOTE_MAJOR="$promote" \
            task frontend:push FRONTEND_VERSION="$version"

      - name: Record GoReleaser changelog base
        id: release-range
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          from pathlib import Path
          metadata = json.loads(Path("dist/metadata.json").read_text())
          base = metadata["previous_tag"]
          if metadata["tag"] != os.environ["GITHUB_REF_NAME"] or not re.fullmatch(r"v3\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", base):
              raise SystemExit("Release metadata has no valid previous v3 tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"previous-tag={base}\n")
          PYCODE

  notes:
    name: refine published release notes
    needs: release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/release-notes.yaml
    with:
      tag: ${{ github.ref_name }}
      base: ${{ needs.release.outputs.previous-tag }}
      publish: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOCKERPUBLICBOT_READ_PAT: ${{ secrets.DOCKERPUBLICBOT_READ_PAT }}

  docs-capabilities:
    name: propose docs capability catalog update
    needs: release
    if: ${{ vars.DOCS_SYNC_APP_ID != '' }}
    concurrency:
      group: docs-capability-catalog-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check docs sync credentials
        id: credentials
        env:
          DOCS_SYNC_APP_ID: ${{ vars.DOCS_SYNC_APP_ID }}
          DOCS_SYNC_APP_PRIVATE_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${DOCS_SYNC_APP_ID:-}" ] && [ -n "${DOCS_SYNC_APP_PRIVATE_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping optional docs sync because its GitHub App credentials are not configured."
          fi

      - name: Check this is the latest published release
        id: latest
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release list --repo docker/sandbox-kit-spec \
            --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "Skipping docs sync for $GITHUB_REF_NAME; latest release is $latest."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.credentials.outputs.enabled == 'true' && steps.latest.outputs.matches == 'true' }}
        with:
          ref: ${{ github.ref }}
          path: spec
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ steps.credentials.outputs.enabled == 'true' && steps.latest.outputs.matches == 'true' }}
        with:
          go-version-file: spec/go.mod
          cache-dependency-path: spec/go.sum

      - name: Create docker/docs app token
        id: app-token
        if: ${{ steps.credentials.outputs.enabled == 'true' && steps.latest.outputs.matches == 'true' }}
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: docker
          repositories: docs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.credentials.outputs.enabled == 'true' && steps.latest.outputs.matches == 'true' }}
        with:
          repository: docker/docs
          path: docs
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Download and verify published capability catalog
        if: ${{ steps.credentials.outputs.enabled == 'true' && steps.latest.outputs.matches == 'true' }}
        working-directory: spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/capabilities
          gh release download "$GITHUB_REF_NAME" \
            --repo docker/sandbox-kit-spec \
            --pattern capabilities.json \
            --pattern checksums.txt \
            --dir dist/capabilities
          expected=$(awk '$2 ~ /(^|\/)capabilities\.json$/ {print $1}' dist/capabilities/checksums.txt)
          actual=$(sha256sum dist/capabilities/capabilities.json | awk '{print $1}')
          test -n "$expected" && test "$expected" = "$actual"
          jq -e --arg version "$GITHUB_REF_NAME" --arg revision "$GITHUB_SHA" \
            '.version == $version and .revision == $revision' \
            dist/capabilities/capabilities.json >/dev/null

      - name: Update the docs capability reference
        if: ${{ steps.credentials.outputs.enabled == 'true' && steps.latest.outputs.matches == 'true' }}
        working-directory: spec
        run: |
          go run ./cmd/capability-catalog docs \
            --catalog dist/capabilities/capabilities.json \
            --page ../docs/content/manuals/ai/sandboxes/customize/author/capabilities.md

      - name: Open docs update pull request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v7.0.8
        if: ${{ steps.credentials.outputs.enabled == 'true' && steps.latest.outputs.matches == 'true' }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: docs
          add-paths: content/manuals/ai/sandboxes/customize/author/capabilities.md
          branch: chore/sync-kit-capabilities
          delete-branch: true
          commit-message: 'docs: update released kit capabilities'
          title: 'docs: update released kit capabilities'
          sign-commits: true
          body: |
            Update the Docker Sandboxes capability reference from the catalog published with `${{ github.ref_name }}`.

            Source release: https://github.com/docker/sandbox-kit-spec/releases/tag/${{ github.ref_name }}

            Runtime support and restrictions remain docs-owned and are preserved by the catalog updater.
