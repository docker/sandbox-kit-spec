name: release

on:
  push:
    tags:
      # Schema-3 frontend + Go module major (path …/v3). See RELEASES.md.
      - "v3.*"

# Publishes kit-tck via GoReleaser and the BuildKit frontend image to Hub.
# Two Hub credentials, for two purposes. Pulls before the push use the org's
# read-only public bot: org variable DOCKERPUBLICBOT_USERNAME and org
# secret DOCKERPUBLICBOT_READ_PAT, which grant no write. The push uses
# Docker OIDC, with no long-lived PAT: set repo variables
# DOCKERHUB_ORGANIZATION and DOCKERHUB_OIDC_CONNECTIONID, and create the
# Hub repo docker/sandbox-kit before the first tag.
permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  release:
    name: release kit-tck and frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate
        run: task validate

      # Match ci.yaml: pin the golangci-lint binary via the action, then
      # markdown through Task (docker image + .markdownlint-cli2.yaml).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: cmd/frontend
          args: --config=../../.golangci.yml

      # The markdownlint image comes from Docker Hub, whose anonymous pull
      # limit is shared by every job on a runner's IP. The read-only org
      # bot lifts it; the OIDC login below replaces it for the push.
      - name: Log in to Docker Hub (read-only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERPUBLICBOT_USERNAME }}
          password: ${{ secrets.DOCKERPUBLICBOT_READ_PAT }}

      - name: Markdownlint
        run: task lint:md

      - name: Unit tests
        run: task test:unit test:consumer

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Before QEMU setup: it pulls its binfmt image from Docker Hub.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # Default is 300s; multi-arch QEMU builds often exceed that before push.
          # login-action@v4.6.0 caps this at 3600 (1h).
          DOCKERHUB_OIDC_EXPIREIN: "3600"
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push frontend image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          promote=
          # Automatically promote :3 only when this stable tag is the highest v3.X.Y on
          # the remote — reruns of older stables must not regress it.
          if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            highest=$(git tag -l 'v3.*.*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)
            if [ "v${version}" = "$highest" ]; then
              promote=1
            fi
          fi
          FRONTEND_PUSH_OK=1 FRONTEND_PROMOTE_MAJOR="$promote" \
            task frontend:push FRONTEND_VERSION="$version"
