name: frontend

on:
  push:
    branches: [main]

# Build and push the BuildKit frontend on every main commit as
# docker/sandbox-kit:<short-sha>. Automatic :3 promotion belongs to the
# stable v3.y.z release path; explicit pre-stable promotion is in RELEASES.md.
# Hub OIDC requires DOCKERHUB_ORGANIZATION and DOCKERHUB_OIDC_CONNECTIONID.
permissions:
  contents: read

jobs:
  build:
    name: build and push frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Before QEMU setup: it pulls its binfmt image from Docker Hub, and
      # anonymously that pull has been refused with toomanyrequests. A
      # cached image covered it then; on a cache miss the setup has
      # nothing to fall back to.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # Default is 300s; multi-arch QEMU builds often exceed that before push.
          # login-action@v4.6.0 caps this at 3600 (1h).
          DOCKERHUB_OIDC_EXPIREIN: "3600"
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push frontend
        run: |
          short_sha=$(printf '%.7s' "${GITHUB_SHA}")
          FRONTEND_PUSH_OK=1 task frontend:push FRONTEND_VERSION="$short_sha"
