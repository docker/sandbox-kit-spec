# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kit-tck

# kit-tck stays in the library module; a local workspace must not add the
# frontend graph to its build. The frontend image is built by Dockerfile.
env:
  - GOWORK=off

builds:
  - id: kit-tck
    main: ./cmd/kit-tck
    binary: kit-tck
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/docker/sandbox-kit-spec/v3/internal/version.Version={{.Version}}
        -X github.com/docker/sandbox-kit-spec/v3/internal/version.Revision={{.FullCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
      - "^ci"
