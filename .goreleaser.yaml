# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kit-tck

# kit-tck stays in the library module; a local workspace must not add the
# frontend graph to its build. The frontend image is built by Dockerfile.
env:
  - GOWORK=off

# Generate the release-time capability snapshot from this tagged checkout.
# GoReleaser requires dist/ to be empty after before hooks, so stage the
# hook output under a commit-scoped /tmp path instead.
before:
  hooks:
    - >-
      go run ./cmd/capability-catalog release --root .
      --version {{ .Tag }} --revision {{ .FullCommit }}
      {{ if and .PreviousTag (ne .PreviousTag "v0.0.0") }}--previous-ref {{ .PreviousTag }}{{ end }}
      --output-dir /tmp/sandbox-kit-capabilities-{{ .FullCommit }}

builds:
  - id: kit-tck
    main: ./cmd/kit-tck
    binary: kit-tck
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X github.com/docker/sandbox-kit-spec/v3/internal/version.Version={{.Version}}
        -X github.com/docker/sandbox-kit-spec/v3/internal/version.Revision={{.FullCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: /tmp/sandbox-kit-capabilities-{{ .FullCommit }}/*

release:
  prerelease: auto
  extra_files:
    - glob: /tmp/sandbox-kit-capabilities-{{ .FullCommit }}/capabilities.json
    - glob: /tmp/sandbox-kit-capabilities-{{ .FullCommit }}/capability-notes.md
  footer: >-
    {{ readFile (printf "/tmp/sandbox-kit-capabilities-%s/capability-notes.md" .FullCommit) }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
      - "^ci"
