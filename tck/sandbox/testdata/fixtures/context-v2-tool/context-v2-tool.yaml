# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
provides: ["context-v2-tool@1.0.0"]
requires: [context-v2-base]
args:
  build:
    default: built
    buildArg: BUILD
  team:
    default: default-team
capabilities:
  - type: com.docker.sandbox/agent-context@2
    config:
      content: 'tool-context-v2 ${{ kit.args.build }} ${{ kit.args.team }} ${{ kit.env.KIT_CONTEXT_TEAM }} $TEAM ${TEAM}'
