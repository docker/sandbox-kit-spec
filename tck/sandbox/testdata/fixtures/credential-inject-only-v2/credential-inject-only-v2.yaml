# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Inject-only credential
description: A credential with inject rules and no env var name, so any environment presence is the runtime inventing one
capabilities:
  # Optional so a runtime claiming only one capability can compose this
  # fixture; the check that consumes the behavior is gated on the claim.
  - type: com.docker.sandbox/network-policy@1
    optional: true
    config:
      runtime:
        allow: [example.com]

  # The contracted service, so the suite's bound secret wires this
  # credential: the runtime composes a WIRED inject-only credential, not
  # an unbound one it may skip.
  - type: com.docker.sandbox/credential@2
    optional: true
    description: Outbound rewrites only; no variable carries this credential
    config:
      service: kit-tck
      phase: runtime
      apiKey:
        proxyManaged: true
        inject:
          - {domain: example.com, header: Authorization, format: "Bearer %s"}
