# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Contradictory startup order
args:
  host_port:
    default: "18435"
  auto_start:
    default: "true"
capabilities:
  - type: com.docker.sandbox/host-port@1
    config:
      host: "${{ kit.args.host_port }}"
      container: 18435
  - type: com.docker.sandbox/lifecycle@1
    order: 400
    config:
      startup:
        - command: "curl --noproxy '*' --fail --silent --show-error --max-time 5 http://localhost:18435/trace > /var/tmp/ordering-contradiction"
  - type: com.docker.sandbox/dockerd@1
    config:
      autoStart: "${{ kit.args.auto_start }}"
