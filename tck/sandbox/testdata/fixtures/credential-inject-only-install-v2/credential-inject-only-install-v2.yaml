# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Inject-only install credential
description: An install-phase inject-only credential beside an env-recording install hook, so a sentinel exposed to hooks is observable
args:
  declared:
    default: "yes"
    env: DECLARED
capabilities:
  # Optional so a runtime claiming only one capability can compose this
  # fixture; the check that consumes the behavior is gated on the claim.
  - type: com.docker.sandbox/network-policy@1
    optional: true
    config:
      install:
        allow: [example.com]

  # The contracted service at install phase: the no-environment duty is
  # phase-blind, and install hooks are where an install credential would
  # surface if a runtime invented a slot for it.
  - type: com.docker.sandbox/credential@2
    optional: true
    description: Outbound rewrites only, during install; no variable carries this credential
    config:
      service: kit-tck
      phase: install
      apiKey:
        inject:
          - {domain: example.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        - command: sh -c 'env > /var/tmp/hook.env'
          env: [DECLARED]
          description: Records the environment the hook was given
