# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
capabilities:
  - type: com.docker.sandbox/kvm@1
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command: "kit-tck-kvm all > /var/tmp/kit-tck-kvm-hook.tmp 2>&1 && mv /var/tmp/kit-tck-kvm-hook.tmp /var/tmp/kit-tck-kvm-hook"
