# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Registry fixture network
capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      install:
        allow: [registry.kit-tck.test, auth.kit-tck.test]
      runtime:
        allow: [registry.kit-tck.test, auth.kit-tck.test, cdn.kit-tck.test]
        deny:
          - hosts: [cdn.kit-tck.test]
            methods: [GET]
            paths: [/blocked]
