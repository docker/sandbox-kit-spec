# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Ordered hook requirer
requires: ["kit-tck-order-provider"]
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: "printf 'requirer,' >> /var/tmp/ordering-dependencies-install"
      startup:
        - command: "printf 'requirer,' >> /var/tmp/ordering-dependencies-startup"
