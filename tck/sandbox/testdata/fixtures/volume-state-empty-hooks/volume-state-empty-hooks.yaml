# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Initial volume contents
description: Records volume emptiness during install before initialization
args:
  volume_path:
    default: /var/tmp/kit-tck-volume
  volume_size:
    default: 1g
  volume_mode:
    default: "0700"
capabilities:
  - type: com.docker.sandbox/volume@1
    config:
      path: "${{ kit.args.volume_path }}"
      size: "${{ kit.args.volume_size }}"
      mode: "${{ kit.args.volume_mode }}"
  - type: com.docker.sandbox/volume@1
    config: {path: /var/tmp/kit-tck-volume-other, size: 1g, mode: "0700"}
  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        # Keep the observation outside the mount: later clearing cannot
        # erase evidence that the hook saw copied image contents.
        - command: [kit-tck-volume, record-empty, "${{ kit.args.volume_path }}", /var/tmp/kit-tck-volume-control, before-install]
          user: "0"
        - command: [kit-tck-volume, write, "${{ kit.args.volume_path }}", initialized, install]
          user: "0"
