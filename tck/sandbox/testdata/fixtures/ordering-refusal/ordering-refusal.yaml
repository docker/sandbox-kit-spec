# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
provides:
- kit-tck-order-trace@1.0.0
args:
  host_port:
    default: '18762'
capabilities:
- type: com.docker.sandbox/host-port@1
  config:
    host: ${{ kit.args.host_port }}
    container: 18761
- type: com.docker.sandbox/lifecycle@1
  id: first
  after:
  - kit-tck-order-cycle#cycle
  config:
    install:
    - command: curl --noproxy "*" --silent --show-error --fail --max-time 5 http://127.0.0.1:18761/ >
        /var/tmp/ordering-refusal
      user: '1000'
    files:
    - path: /var/tmp/ordering-refusal-config
      content: control
