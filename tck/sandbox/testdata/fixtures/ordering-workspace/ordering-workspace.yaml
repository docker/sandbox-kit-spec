# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
capabilities:
- type: com.docker.sandbox/lifecycle@1
  before:
  - com.docker.sandbox/lifecycle@1
  config:
    install:
    - command: test -r "$WORKSPACE_DIR/nested/marker" && cat "$WORKSPACE_DIR/nested/marker" > /var/tmp/ordering-workspace
        && "$WORKSPACE_DIR/check" >> /var/tmp/ordering-workspace && printf install >> "$WORKSPACE_DIR/installed"
      user: '1000'
      env:
      - WORKSPACE_DIR
