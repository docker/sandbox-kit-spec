schemaVersion: "3"
kind: mixin
capabilityScopes: [{}, {}]
capabilities:
  - group:
      capabilities:
        - type: com.docker.sandbox/lifecycle@1
          scope: 0
          config:
            startup: [{command: "true"}]
          source: {kit: "registry.example/base:1.0.0", path: "capabilities[0]"}
    source: {kit: "registry.example/base:1.0.0", path: "capabilities[0]"}
    declarationBlocks: ["0:0"]
  - group:
      optional: true
      capabilities:
        - type: com.docker.sandbox/volume@1
          scope: 1
          config: {path: /var/tmp/republished-volume}
          source: {kit: "registry.example/feature:1.0.0", path: "capabilities[0].group.capabilities[0]"}
        - type: com.docker.sandbox/lifecycle@1
          scope: 1
          config:
            files:
              - {path: /var/tmp/republished-feature, content: selected}
          source: {kit: "registry.example/feature:1.0.0", path: "capabilities[0].group.capabilities[1]"}
    source: {kit: "registry.example/feature:1.0.0", path: "capabilities[0]"}
