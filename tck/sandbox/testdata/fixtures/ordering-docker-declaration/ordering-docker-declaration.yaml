# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
capabilities:
- type: com.docker.sandbox/dockerd@1
- type: com.docker.sandbox/lifecycle@1
  config:
    startup:
    - command: curl --noproxy "*" --fail --silent --unix-socket /var/run/docker.sock http://localhost/_ping
        >> /var/tmp/ordering-ping
    - command: cat /var/tmp/ordering-engine-config >> /var/tmp/ordering-config-observed
