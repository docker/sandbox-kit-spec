# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Credential phases both
capabilities:
  - type: com.docker.sandbox/credential@2
    config:
      service: kit-tck
      phase: [install, runtime]
      apiKey:
        name: KIT_TCK_PHASE_TOKEN
        proxyManaged: true
  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        - command: sh -c 'printf "%s" "${KIT_TCK_PHASE_TOKEN-}" > /var/tmp/credential-at-install'
          env: [KIT_TCK_PHASE_TOKEN]
