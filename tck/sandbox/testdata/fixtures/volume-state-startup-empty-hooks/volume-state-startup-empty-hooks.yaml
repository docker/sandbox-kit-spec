# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Fresh volume contents during startup
description: Records a newly selected destination before startup initialization
args:
  volume_path:
    default: /var/tmp/kit-tck-volume
  volume_size:
    default: 1g
  volume_mode:
    default: "0700"
capabilities:
  - type: com.docker.sandbox/volume@1
    config:
      path: "${{ kit.args.volume_path }}"
      size: "${{ kit.args.volume_size }}"
      mode: "${{ kit.args.volume_mode }}"
  - type: com.docker.sandbox/volume@1
    config: {path: /var/tmp/kit-tck-volume-other, size: 1g, mode: "0700"}
  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      startup:
        # Keep the observation outside the mount so clearing copied
        # image contents after startup cannot hide what the hook saw.
        - command: [kit-tck-volume, record-empty, "${{ kit.args.volume_path }}", /var/tmp/kit-tck-volume-control, before-startup]
          user: "0"
        - command: [kit-tck-volume, write, "${{ kit.args.volume_path }}", initialized, startup]
          user: "0"
