# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
capabilities:
- type: com.docker.sandbox/lifecycle@1
  id: tools
  after:
  - com.docker.sandbox/dockerd@1
  config:
    install:
    - command: printf 'tools,' >> /var/tmp/ordering-per-step
      user: '1000'
    startup:
    - command: curl --noproxy "*" --fail --silent --unix-socket /var/run/docker.sock http://localhost/_ping
        >> /var/tmp/ordering-ping
- type: com.docker.sandbox/lifecycle@1
  config:
    install:
    - command: test "$(cat /var/tmp/ordering-per-step)" = tools, && printf 'use,' >> /var/tmp/ordering-per-step
      user: '1000'
- type: com.docker.sandbox/dockerd@1
