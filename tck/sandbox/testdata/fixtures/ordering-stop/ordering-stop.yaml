# syntax=docker/sandbox-kit:3
schemaVersion: '3'
kind: mixin
capabilities:
- type: com.docker.sandbox/lifecycle@1
  id: b
  after:
  - '#a'
  config:
    startup:
    - command:
      - python3
      - /usr/local/bin/kit-tck-ordering
      - background
      - B
      background: true
    - command:
      - python3
      - /usr/local/bin/kit-tck-ordering
      - wait
      - B
- type: com.docker.sandbox/dockerd@1
- type: com.docker.sandbox/lifecycle@1
  id: a
  config:
    startup:
    - command:
      - python3
      - /usr/local/bin/kit-tck-ordering
      - background
      - A
      background: true
    - command:
      - python3
      - /usr/local/bin/kit-tck-ordering
      - wait
      - A
    files:
    - path: /var/tmp/ordering-stop-resource
      content: placed
