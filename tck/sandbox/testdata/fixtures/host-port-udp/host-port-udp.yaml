# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
args:
  host_port:
    default: "18431"
  container_port:
    default: "18432"
capabilities:
  - type: com.docker.sandbox/host-port@1
    config:
      host: "${{ kit.args.host_port }}"
      container: "${{ kit.args.container_port }}"
      transport: udp
