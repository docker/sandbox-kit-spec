# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Inject-only credential, default management
description: The inject-only shape without proxyManaged, as real kits declare it, so the no-env duty is judged on the default branch too
capabilities:
  # Optional so a runtime claiming only one capability can compose this
  # fixture; the check that consumes the behavior is gated on the claim.
  - type: com.docker.sandbox/network-policy@1
    optional: true
    config:
      runtime:
        allow: [example.com]

  # The contracted service, so the suite's bound secret wires this
  # credential — and no proxyManaged flag: the no-environment duty is not
  # conditioned on it.
  - type: com.docker.sandbox/credential@2
    optional: true
    description: Outbound rewrites only; no variable carries this credential
    config:
      service: kit-tck
      phase: runtime
      apiKey:
        inject:
          - {domain: example.com, header: Authorization, format: "Bearer %s"}
