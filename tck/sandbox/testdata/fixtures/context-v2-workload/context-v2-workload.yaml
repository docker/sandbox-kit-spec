# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
provides: ["context-v2-base@1.0.0"]
capabilities:
  - type: com.docker.sandbox/agent-context@2
    config:
      filename: AGENTS.md
      content: base-context-v2
build: |
  FROM docker/sandbox-templates:claude-code-docker
  ENV KIT_CONTEXT_TEAM=image
  RUN mkdir -p /home/agent/.kit-tck/v2 /home/agent/.kit-tck/v2-other \
      && for file in /home/agent/AGENTS.md /home/agent/.kit-tck/v2/AGENTS.md /home/agent/.kit-tck/v2-other/OTHER.md; do \
        printf '%s\n' 'existing-context-v2' > "$file"; done
  COPY --chmod=0755 entrypoint /usr/local/bin/context-v2-entrypoint
  WORKDIR /home/agent/workspace
  ENTRYPOINT ["/usr/local/bin/context-v2-entrypoint"]
