# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Scoped egress
description: Allows one host at runtime and one during install only, so the phase boundary is observable
capabilities:
  # Every entry is optional so a runtime claiming any one capability can
  # compose this fixture; the checks that consume each behavior are gated
  # on the claim that provides it.
  - type: com.docker.sandbox/network-policy@1
    optional: true
    config:
      install:
        allow: [example.net]
      runtime:
        allow: [example.com]

  - type: com.docker.sandbox/credential@2
    optional: true
    description: A proxy-managed token, so the sandbox should see a sentinel and never the secret
    config:
      service: kit-tck
      phase: runtime
      apiKey:
        name: KIT_TCK_TOKEN
        proxyManaged: true
        inject:
          - {domain: example.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        - command: sh -c 'if kit-tck-probe https://example.net; then echo reachable > /var/tmp/install-egress; else echo blocked > /var/tmp/install-egress; fi'
          description: Records whether the install-only domain was open during install
